name: Manual Batch

on:
  schedule:
    # GitHub Actions cron uses UTC; 17:00 UTC is 02:00 KST.
    - cron: "0 17 * * *"
  # 수동 실행: 검증 또는 긴급 재실행 시 안전 옵션을 선택합니다.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Keep external publish disabled"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      enable_telegram_publish:
        description: "Allow Telegram publishing when dry_run is false"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      force_fallback:
        description: "Skip OpenAI and use deterministic fallback message generation"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      apply_migrations:
        description: "Run Alembic migrations before the batch"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# 중복 실행 방지: 같은 브랜치의 수동/예약 배치가 겹치면 순차 실행합니다.
concurrency:
  group: manual-batch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      ENABLE_TELEGRAM_PUBLISH: ${{ github.event_name == 'schedule' && 'true' || inputs.enable_telegram_publish }}
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
      FORCE_FALLBACK: ${{ github.event_name == 'schedule' && 'true' || inputs.force_fallback }}

    steps:
      # 실행 환경 준비
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      # 코드 품질 검증
      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run Mypy
        run: python -m mypy src tests

      - name: Check formatting
        run: python -m black --check .

      - name: Compile sources
        run: python -m compileall src

      # DB 스키마 반영: 운영 배치와 배포 작업을 분리하기 위해 수동 선택 시에만 실행합니다.
      - name: Apply database migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_migrations == 'true' }}
        run: python -m alembic upgrade head

      # 원천 데이터 수집 및 실행 ID 전달
      - name: Ingest raw events
        run: |
          ingest_output="$(python -m bicycle_road_event_alarm.cli.ingest_raw_events)"
          echo "$ingest_output"
          batch_run_id="$(echo "$ingest_output" | sed -n 's/^RUN_ID=//p' | tail -n 1)"
          if [ -z "$batch_run_id" ]; then
            echo "RUN_ID was not emitted by ingest step" >&2
            exit 1
          fi
          echo "BATCH_RUN_ID=$batch_run_id" >> "$GITHUB_ENV"

      # 이벤트 정규화
      - name: Normalize events
        run: python -m bicycle_road_event_alarm.cli.normalize_events --run-id "$BATCH_RUN_ID"

      # 메시지 생성 및 Telegram 발송
      - name: Generate and publish message
        run: |
          if [ "$FORCE_FALLBACK" = "true" ]; then
            python -m bicycle_road_event_alarm.cli.generate_messages --run-id "$BATCH_RUN_ID" --force-fallback
          else
            python -m bicycle_road_event_alarm.cli.generate_messages --run-id "$BATCH_RUN_ID"
          fi
