[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bicycle-road-event-alarm"
version = "0.1.0"
description = "Weekend cycling event alert service for Korean bicycle-road users."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "beautifulsoup4>=4.12",
  "openai>=1.0",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "requests>=2.32",
  "sqlalchemy>=2.0,<2.1",
]

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "mypy>=1.10,<2",
  "pytest>=8.0",
  "ruff>=0.5",
  "types-requests>=2.32",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
